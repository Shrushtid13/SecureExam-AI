version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: secureexam_db_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123 # CHANGE THIS IN PRODUCTION
      POSTGRES_DB: secureexam
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost only
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  redis:
    image: redis:7-alpine
    container_name: secureexam_redis_prod
    ports:
      - "127.0.0.1:6379:6379" # Bind to localhost only
    volumes:
      - redis_data_prod:/data
    restart: always

  minio:
    image: quay.io/minio/minio
    container_name: secureexam_minio_prod
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123 # CHANGE THIS IN PRODUCTION
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    restart: always

  minio-init:
    image: quay.io/minio/mc
    container_name: secureexam_minio_init_prod
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 admin admin123;
      /usr/bin/mc mb myminio/secureexam-snapshots || true;
      /usr/bin/mc anonymous set download myminio/secureexam-snapshots || true;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secureexam_backend_prod
    ports:
      - "127.0.0.1:5000:5000"
    command: npm start # Ensure package.json has a start script like 'node src/server.js'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres123@db:5432/secureexam
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecuresecretkeyshouldbechanged # CHANGE THIS IN PRODUCTION
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=secureexam-snapshots
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - db
      - redis
      - minio
    restart: always

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: secureexam_ai_service_prod
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PORT=8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=secureexam-snapshots
      - DATABASE_URL=postgres://postgres:postgres123@db:5432/secureexam
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - minio
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secureexam_frontend_prod
    ports:
      - "127.0.0.1:3000:3000"
    command: npm run preview -- --host 0.0.0.0 --port 3000
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  minio_data_prod:
